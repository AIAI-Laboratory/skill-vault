name: PR Coverage Report

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

concurrency:
  group: coverage-report-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  report:
    name: Publish PR coverage
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Do not check out, install dependencies, or execute code from the PR here.
      # This workflow only reads numeric coverage data, including for fork PRs.
      - name: Find coverage artifact
        id: artifact
        uses: actions/github-script@v9
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              ...context.repo, run_id: context.payload.workflow_run.id,
            });
            const artifact = data.artifacts.find(item => item.name === 'coverage-summary' && !item.expired);
            core.setOutput('available', Boolean(artifact));
      - name: Download coverage summary
        if: steps.artifact.outputs.available == 'true'
        uses: actions/download-artifact@v8
        with:
          name: coverage-summary
          path: coverage-data
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Update coverage comment
        uses: actions/github-script@v9
        env:
          COVERAGE_AVAILABLE: ${{ steps.artifact.outputs.available }}
        with:
          script: |
            const fs = require('node:fs');
            const run = context.payload.workflow_run;
            const marker = '<!-- skill-vault-test-coverage -->';
            let report = 'Coverage is unavailable for this run. Check CI logs for installation or test failures.';
            if (process.env.COVERAGE_AVAILABLE === 'true') {
              const file = 'coverage-data/coverage-summary.json';
              if (fs.statSync(file).size > 1024 * 1024) throw new Error('Coverage summary is too large');
              const { total } = JSON.parse(fs.readFileSync(file, 'utf8'));
              const rows = ['statements', 'branches', 'functions', 'lines'].map(metric => {
                const value = total?.[metric];
                if (!value || ![value.pct, value.covered, value.total].every(Number.isFinite) ||
                    value.pct < 0 || value.pct > 100 || value.covered < 0 || value.covered > value.total) {
                  throw new Error(`Invalid coverage metric: ${metric}`);
                }
                return `| ${metric} | ${value.pct}% | ${value.covered}/${value.total} |`;
              });
              report = ['| Metric | Coverage | Covered / Total |', '| --- | ---: | ---: |', ...rows].join('\n');
            }
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              ...context.repo, commit_sha: run.head_sha,
            });
            for (const pr of prs) {
              const { data: current } = await github.rest.pulls.get({ ...context.repo, pull_number: pr.number });
              if (current.state !== 'open' || current.head.sha !== run.head_sha ||
                  current.head.repo?.full_name !== run.head_repository.full_name) continue;
              const body = [marker, '## Test coverage', '', report, '',
                `Commit: ${run.head_sha.slice(0, 7)} · CI: **${run.conclusion}**`,
                `[View checks and download HTML coverage](${run.html_url})`,
              ].join('\n');
              const comments = await github.paginate(github.rest.issues.listComments, {
                ...context.repo, issue_number: pr.number, per_page: 100,
              });
              const previous = comments.find(comment => comment.user?.login === 'github-actions[bot]' &&
                comment.body?.startsWith(marker));
              if (previous) {
                await github.rest.issues.updateComment({ ...context.repo, comment_id: previous.id, body });
              } else {
                await github.rest.issues.createComment({ ...context.repo, issue_number: pr.number, body });
              }
            }

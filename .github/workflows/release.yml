name: Release Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v0.1.0). Leave blank to use version from package.json.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    name: Build & Prepare Draft Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Validate release version
        env:
          RELEASE_CANDIDATE: ${{ inputs.tag_name || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { pathToFileURL } from 'node:url';
          import { readReleaseVersion } from './scripts/release-version.mjs';
          const tag = readReleaseVersion(pathToFileURL(`${process.cwd()}/`), process.env.RELEASE_CANDIDATE);
          fs.appendFileSync(process.env.GITHUB_ENV, `RELEASE_TAG=${tag}\nRELEASE_VERSION=${tag}\n`);
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build & package extension
        run: npm run package

      - name: Prepare GitHub Draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Preparing draft release ${RELEASE_TAG}..."
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            if [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" != true ]; then
              echo 'Refusing to overwrite assets of a published release.' >&2
              exit 1
            fi
            echo "Draft ${RELEASE_TAG} already exists, uploading assets..."
            gh release upload "${RELEASE_TAG}" skill-vault-*.zip skill-vault.zip --clobber
          else
            echo "Creating draft release ${RELEASE_TAG}..."
            gh release create "${RELEASE_TAG}" skill-vault-*.zip skill-vault.zip \
              --target "$GITHUB_SHA" \
              --title "Skill Vault ${RELEASE_TAG}" \
              --draft \
              --generate-notes
          fi

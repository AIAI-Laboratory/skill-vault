name: Chrome Web Store

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      operation:
        description: 'status: read only; upload: save draft; publish: upload and submit for review'
        type: choice
        options:
          - status
          - upload
          - publish
        default: status

permissions:
  contents: read

concurrency:
  group: chrome-web-store
  cancel-in-progress: false

jobs:
  webstore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CWS_OPERATION: ${{ github.event_name == 'push' && 'publish' || inputs.operation }}

    steps:
      - uses: actions/checkout@v7

      - name: Validate configuration
        env:
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          CWS_SERVICE_ACCOUNT_JSON: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON }}
        run: |
          node <<'NODE'
          for (const key of ['CWS_PUBLISHER_ID', 'CWS_EXTENSION_ID', 'CWS_SERVICE_ACCOUNT_JSON']) {
            if (!process.env[key]) throw new Error(`Missing GitHub configuration: ${key}`);
          }
          const credentials = JSON.parse(process.env.CWS_SERVICE_ACCOUNT_JSON);
          if (credentials.type !== 'service_account' || !credentials.client_email || !credentials.private_key) {
            throw new Error('CWS_SERVICE_ACCOUNT_JSON must contain a complete service account JSON key.');
          }
          NODE

      - name: Check Chrome Web Store access
        id: access
        uses: cssnr/webstore-publish-action@9c4e7ae29beb517bf2d22f32d849455d178cbca6 # v1
        with:
          publisher_id: ${{ vars.CWS_PUBLISHER_ID }}
          extension_id: ${{ vars.CWS_EXTENSION_ID }}
          json_data: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON }}
          status: true

      - uses: actions/setup-node@v7
        if: env.CWS_OPERATION != 'status'
        with:
          node-version: '22'
          cache: npm

      - name: Validate extension version
        if: env.CWS_OPERATION != 'status'
        env:
          STORE_STATUS: ${{ steps.access.outputs.status }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { version } = JSON.parse(fs.readFileSync('public/manifest.json', 'utf8'));
          const parts = value => {
            if (!/^\d+(\.\d+){0,3}$/.test(value)) throw new Error(`Invalid Chrome version: ${value}`);
            return [...value.split('.').map(Number), 0, 0, 0].slice(0, 4);
          };
          const newer = (a, b) => {
            const left = parts(a), right = parts(b);
            for (let i = 0; i < 4; i++) {
              if (left[i] !== right[i]) return left[i] > right[i];
            }
            return false;
          };
          parts(version);
          if (process.env.GITHUB_REF_TYPE === 'tag' && process.env.GITHUB_REF_NAME !== `v${version}`) {
            throw new Error('Release tag must match public/manifest.json version.');
          }
          const status = JSON.parse(process.env.STORE_STATUS);
          if (status.submittedItemRevisionStatus?.state === 'PENDING_REVIEW') {
            throw new Error('An extension version is already pending review. Wait for that review to finish.');
          }
          for (const revision of [status.publishedItemRevisionStatus, status.submittedItemRevisionStatus]) {
            for (const channel of revision?.distributionChannels || []) {
              if (channel.crxVersion && !newer(version, channel.crxVersion)) {
                throw new Error(`Increase manifest.version: store already contains ${channel.crxVersion}.`);
              }
            }
          }
          NODE

      - name: Install dependencies
        if: env.CWS_OPERATION != 'status'
        run: npm ci

      - name: Validate extension
        if: env.CWS_OPERATION != 'status'
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npm test

      - name: Build and package
        if: env.CWS_OPERATION != 'status'
        run: |
          npm run build
          node scripts/package.mjs

      - name: Upload ZIP
        if: env.CWS_OPERATION != 'status'
        id: upload
        uses: cssnr/webstore-publish-action@9c4e7ae29beb517bf2d22f32d849455d178cbca6 # v1
        with:
          publisher_id: ${{ vars.CWS_PUBLISHER_ID }}
          extension_id: ${{ vars.CWS_EXTENSION_ID }}
          token: ${{ steps.access.outputs.token }}
          zip_file: skill-vault.zip

      - name: Wait for upload processing
        if: env.CWS_OPERATION != 'status'
        env:
          UPLOAD_RESULT: ${{ steps.upload.outputs.upload }}
          CWS_TOKEN: ${{ steps.access.outputs.token }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
        run: |
          state=$(jq -r '.uploadState' <<< "$UPLOAD_RESULT")
          for attempt in {1..60}; do
            case "$state" in
              SUCCEEDED) exit 0 ;;
              IN_PROGRESS|UPLOAD_IN_PROGRESS) ;;
              *) echo "Upload failed or returned an unexpected state: $state"; exit 1 ;;
            esac
            sleep 5
            response=$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $CWS_TOKEN" \
              "https://chromewebstore.googleapis.com/v2/publishers/$CWS_PUBLISHER_ID/items/$CWS_EXTENSION_ID:fetchStatus")
            state=$(jq -r '.lastAsyncUploadState' <<< "$response")
          done
          if [ "$state" = SUCCEEDED ]; then exit 0; fi
          echo 'Upload did not finish within five minutes. Check the Developer Dashboard.'
          exit 1

      - name: Submit for review
        if: env.CWS_OPERATION == 'publish'
        uses: cssnr/webstore-publish-action@9c4e7ae29beb517bf2d22f32d849455d178cbca6 # v1
        with:
          publisher_id: ${{ vars.CWS_PUBLISHER_ID }}
          extension_id: ${{ vars.CWS_EXTENSION_ID }}
          token: ${{ steps.access.outputs.token }}
          publish: default
          status: true
